<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchCupMobile</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
touch-action:none;
user-select:none;
}


body{

background:#111827;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Arial;

}



#game{

position:relative;

width:380px;

height:650px;

}



canvas{

background:#2e7d32;

border:4px solid white;

border-radius:20px;

}



#menu{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.85);

color:white;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

overflow:auto;

z-index:10;

}



h1{

font-size:42px;

color:#ffd700;

margin-bottom:15px;

}



h2{

margin:10px;

}



.team{

width:300px;

padding:15px;

margin:6px;

background:rgba(255,255,255,.15);

border:2px solid transparent;

border-radius:20px;

text-align:center;

font-size:18px;

}



.team.selected{

border-color:#ffd700;

background:rgba(255,215,0,.3);

}



.difficulty{

width:300px;

padding:12px;

margin:5px;

border-radius:15px;

background:#333;

text-align:center;

}



.difficulty.selected{

background:#ffd700;

color:black;

}



button{

padding:14px 35px;

border:0;

border-radius:40px;

font-size:18px;

font-weight:bold;

margin-top:12px;

}


#startBtn{

background:#4caf50;

color:white;

}


#careerBtn{

background:#ffd700;

}



#hud{

position:absolute;

top:10px;

left:0;

width:100%;

display:flex;

justify-content:space-around;

color:white;

font-size:22px;

z-index:5;

}



.hidden{

display:none!important;

}
  #joystick{

position:absolute;

left:25px;

bottom:30px;

width:120px;

height:120px;

border-radius:50%;

background:rgba(255,255,255,.25);

z-index:20;

}



#stick{

position:absolute;

left:35px;

top:35px;

width:50px;

height:50px;

background:white;

border-radius:50%;

}



#shoot{

position:absolute;

right:30px;

bottom:45px;

width:85px;

height:85px;

border-radius:50%;

background:#ffd700;

font-size:30px;

z-index:20;

}



</style>

</head>


<body>


<div id="game">


<canvas id="canvas"
width="380"
height="650">
</canvas>



<div id="menu">


<h1>⚽ MatchCup</h1>


<h2>Выбери команду</h2>



<div class="team" data-team="aziz">
🔥 Азиз + ⚔️ Хабиб
</div>


<div class="team" data-team="abdul">
🦁 Абдул + ⚡ Мухаммад
</div>


<div class="team" data-team="shamil">
🛡 Шамиль + 🛡 Шамиль Jr
</div>


<div class="team" data-team="mjr">
⚡ Мухаммад + ⚡ Мухаммад Jr
</div>




<h2>Сложность</h2>


<div class="difficulty selected" data-level="easy">
🟢 Лёгкая
</div>


<div class="difficulty" data-level="normal">
🟡 Средняя
</div>


<div class="difficulty" data-level="hard">
🔴 Сложная
</div>



<button id="startBtn">
⚽ Играть 2 VS 2
</button>



<button id="careerBtn">
🏆 Карьера
</button>



</div>




<div id="hud" class="hidden">

<div>
🔴 <span id="scoreA">0</span>
</div>


<div>
⏱ <span id="time">60</span>
</div>


<div>
<span id="scoreB">0</span> 🔵
</div>


</div>



<div id="joystick">

<div id="stick"></div>

</div>



<button id="shoot">
⚽
</button>



</div>



<script src="game.js"></script>

<script src="career.js"></script>


</body>

</html>
