<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MATCH CUP - Career</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    touch-action:none;
}

body{
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
    overflow:hidden;
}


#game-wrapper{
    position:relative;
    width:100%;
    max-width:600px;
    height:100vh;
    max-height:850px;
}


canvas{
    width:100%;
    height:100%;
    background:#2e7d32;
    border:4px solid white;
    border-radius:20px;
}


/* МЕНЮ */

#menu{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
rgba(0,0,0,.85),
rgba(0,0,0,.95)
);

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

color:white;
padding:20px;

z-index:10;

overflow:auto;

}


h1{

font-size:45px;

background:linear-gradient(
45deg,#ffd700,#ff8800
);

-webkit-background-clip:text;
color:transparent;

margin-bottom:5px;

}


.subtitle{
color:#aaa;
margin-bottom:15px;
}



/* КАРТОЧКИ ИГРОКОВ */

.players{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

width:100%;
max-width:380px;

}


.player{

background:
rgba(255,255,255,.1);

border:2px solid rgba(255,255,255,.2);

border-radius:20px;

padding:12px;

text-align:center;

font-weight:bold;

}


.player.selected{

border-color:#ffd700;

background:
rgba(255,215,0,.25);

}


.player span{

font-size:30px;
display:block;

}


.stats{

font-size:11px;
color:#ddd;
margin-top:5px;

}




button{

border:none;

padding:14px 35px;

border-radius:50px;

font-size:18px;

font-weight:bold;

margin-top:15px;

}


#startBtn{

background:#4caf50;
color:white;

}


#careerBtn{

background:#ffd700;
color:#222;

}


#teamBtn{

background:#2196f3;
color:white;

}



#hud{

position:absolute;

top:10px;
left:0;

width:100%;

display:flex;
justify-content:space-around;

color:white;

font-size:20px;

z-index:5;

}


.hidden{
display:none!important;
}



</style>

</head>


<body>


<div id="game-wrapper">


<canvas id="gameCanvas"
width="600"
height="800">
</canvas>



<div id="menu">


<h1>⚽ MATCH CUP</h1>

<div class="subtitle">
Режим: 2 VS 2
</div>


<h3>Выбери игрока</h3>


<div class="players">


<div class="player" data-id="habib">

<span>⚔️</span>

Хабиб

<div class="stats">
💥90 ⚡75 🛡80
</div>

</div>



<div class="player" data-id="salaudin">

<span>⚔️</span>

Салаудин

<div class="stats">
💥80 ⚡95 🛡75
</div>

</div>



<div class="player" data-id="aziz">

<span>🔥</span>

Азиз

<div class="stats">
💥95 ⚡85 🛡70
</div>

</div>



<div class="player" data-id="abdul">

<span>🦁</span>

Абдул

<div class="stats">
💥80 ⚡80 🛡95
</div>

</div>




<div class="player" data-id="shamil">

<span>🛡</span>

Шамиль Рб

<div class="stats">
💥75 ⚡70 🛡95
</div>

</div>




<div class="player" data-id="shamiljr">

<span>🛡</span>

Шамиль Jr

<div class="stats">
💥80 ⚡90 🛡80
</div>

</div>




<div class="player" data-id="muhammad">

<span>⚡</span>

Мухаммад

<div class="stats">
💥90 ⚡90 🛡75
</div>

</div>




<div class="player" data-id="muhammadjr">

<span>⚡</span>

Мухаммад Jr

<div class="stats">
💥85 ⚡95 🛡85
</div>

</div>



</div>



<button id="startBtn">
⚽ Играть 2 VS 2
</button>


<button id="careerBtn">
🏆 Карьера
</button>


<button id="teamBtn">
👕 Команда
</button>



</div>




<div id="hud" class="hidden">

<div>
🔴 <span id="scoreA">0</span>
</div>


<div>
⏱ 60
</div>


<div>
<span id="scoreB">0</span> 🔵
</div>


</div>



</div>



<script src="game.js"></script>
<script src="career.js"></script>


</body>
</html>
