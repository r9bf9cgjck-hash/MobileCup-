<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchCupMobile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
touch-action:none;
}

body{

background:#101820;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

font-family:Arial;

}


#game{

position:relative;

width:390px;
height:650px;

}


canvas{

position:absolute;

left:0;
top:0;

width:390px;
height:500px;

background:#278a3b;

border:3px solid white;

border-radius:15px;

}



#menu{

position:absolute;

width:100%;
height:100%;

background:rgba(0,0,0,.85);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

color:white;

z-index:10;

overflow:auto;

}


h1{

font-size:40px;

color:#ffd700;

margin-bottom:15px;

}


h3{

margin:8px;

}



.option{

width:320px;

padding:12px;

margin:5px;

background:#333;

border-radius:15px;

text-align:center;

font-size:18px;

border:2px solid transparent;

}


.option.selected{

background:#ffd700;

color:black;

border-color:white;

}



button{

border:none;

border-radius:30px;

padding:14px 35px;

font-size:18px;

font-weight:bold;

margin:8px;

}



#startBtn{

background:#4caf50;

color:white;

}


#careerBtn{

background:#ffd700;

}



#hud{

position:absolute;

top:10px;

width:100%;

display:flex;

justify-content:space-around;

color:white;

font-size:22px;

z-index:5;

}



.hidden{

display:none!important;

}
  #joystick{

position:absolute;

left:20px;

bottom:20px;

width:120px;

height:120px;

background:rgba(255,255,255,.25);

border-radius:50%;

z-index:20;

}


#stick{

position:absolute;

left:35px;

top:35px;

width:50px;

height:50px;

background:white;

border-radius:50%;

}



.control{

position:absolute;

right:25px;

border-radius:50%;

width:80px;

height:80px;

font-size:28px;

z-index:20;

}



#shoot{

bottom:45px;

background:#ffd700;

}



#pass{

bottom:140px;

background:#00bfff;

}



</style>

</head>


<body>


<div id="game">


<canvas id="canvas" width="800" height="500"></canvas>



<div id="menu">


<h1>⚽ MatchCup</h1>


<h3>Команда</h3>


<div class="option selected" data-team="aziz">
🔥 Азиз + Хабиб
</div>


<div class="option" data-team="abdul">
🦁 Абдул + Мухаммад
</div>


<div class="option" data-team="shamil">
🛡 Шамиль + Шамиль Jr
</div>


<div class="option" data-team="muhammad">
⚡ Мухаммад + Мухаммад Jr
</div>



<h3>Режим</h3>


<div class="option selected" data-mode="2">
⚽ 2 VS 2
</div>


<div class="option" data-mode="3">
🥅 3 VS 3
</div>


<div class="option" data-mode="4">
🏟 4 VS 4
</div>



<h3>Сложность</h3>


<div class="option selected" data-level="easy">
🟢 Лёгкая
</div>


<div class="option" data-level="normal">
🟡 Средняя
</div>


<div class="option" data-level="hard">
🔴 Сложная
</div>



<button id="startBtn">
Играть
</button>


<button id="careerBtn">
🏆 Карьера
</button>


</div>




<div id="hud" class="hidden">

<div>
🔴 <span id="scoreA">0</span>
</div>

<div>
⏱ <span id="time">60</span>
</div>

<div>
<span id="scoreB">0</span> 🔵
</div>

</div>




<div id="joystick">

<div id="stick"></div>

</div>



<button id="pass" class="control">
🟦
</button>


<button id="shoot" class="control">
⚽
</button>



</div>



<script src="game.js"></script>

<script src="career.js"></script>


</body>

</html>
