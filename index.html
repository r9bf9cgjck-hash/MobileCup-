<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchCupMobile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
touch-action:none;
}


body{

background:#101820;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

font-family:Arial;

}



#game{

position:relative;

width:390px;
height:700px;

}



canvas{

position:absolute;

left:0;
top:0;

width:390px;
height:700px;

background:#2e7d32;

border:4px solid white;
border-radius:20px;

}



#menu{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.88);

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

color:white;

z-index:10;

}



h1{

font-size:42px;

color:#ffd700;

margin-bottom:15px;

}



.card{

width:320px;

padding:15px;

margin:6px;

background:rgba(255,255,255,.15);

border:2px solid transparent;

border-radius:18px;

text-align:center;

font-size:18px;

}



.card.selected{

border-color:#ffd700;

background:rgba(255,215,0,.3);

}



.level{

width:320px;

padding:10px;

margin:4px;

background:#333;

border-radius:15px;

text-align:center;

}



.level.selected{

background:#ffd700;

color:black;

}



button{

margin-top:15px;

padding:15px 40px;

border:0;

border-radius:40px;

font-size:18px;

font-weight:bold;

}



#startBtn{

background:#4caf50;

color:white;

}



#careerBtn{

background:#ffd700;

}



#hud{

position:absolute;

top:10px;

left:0;

width:100%;

display:flex;

justify-content:space-around;

color:white;

font-size:22px;

z-index:5;

}



.hidden{

display:none!important;

}
  #joystick{

position:absolute;

left:25px;

bottom:35px;

width:120px;

height:120px;

background:rgba(255,255,255,.25);

border-radius:50%;

z-index:20;

}



#stick{

position:absolute;

left:35px;

top:35px;

width:50px;

height:50px;

background:white;

border-radius:50%;

}



#shoot{

position:absolute;

right:30px;

bottom:55px;

width:85px;

height:85px;

border-radius:50%;

background:#ffd700;

font-size:30px;

z-index:20;

}



</style>

</head>


<body>


<div id="game">


<canvas id="canvas"></canvas>



<div id="menu">


<h1>⚽ MatchCup</h1>


<h3>Выбери команду</h3>


<div class="card" data-team="aziz">

🔥 Азиз + ⚔️ Хабиб

</div>


<div class="card" data-team="abdul">

🦁 Абдул + ⚡ Мухаммад

</div>


<div class="card" data-team="shamil">

🛡 Шамиль + 🛡 Шамиль Jr

</div>


<div class="card" data-team="muhammad">

⚡ Мухаммад + ⚡ Мухаммад Jr

</div>



<h3>Сложность</h3>


<div class="level selected" data-level="easy">

🟢 Лёгкая

</div>


<div class="level" data-level="normal">

🟡 Средняя

</div>


<div class="level" data-level="hard">

🔴 Сложная

</div>




<button id="startBtn">

⚽ Играть 2 VS 2

</button>



<button id="careerBtn">

🏆 Карьера

</button>


</div>




<div id="hud" class="hidden">


<div>
🔴 <span id="scoreA">0</span>
</div>


<div>
⏱ <span id="time">60</span>
</div>


<div>
<span id="scoreB">0</span> 🔵
</div>


</div>




<div id="joystick">

<div id="stick"></div>

</div>



<button id="shoot">

⚽

</button>



</div>




<script src="game.js"></script>

<script src="career.js"></script>


</body>

</html>
