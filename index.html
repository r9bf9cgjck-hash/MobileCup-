<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchCupMobile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
touch-action:none;
}


body{

background:#101820;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;

}



#game{

position:relative;
width:360px;
height:640px;

}



canvas{

background:#2e7d32;
border:4px solid white;
border-radius:20px;

}



#menu{

position:absolute;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.85);

color:white;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

z-index:10;

overflow:auto;

}



h1{

font-size:38px;
color:#ffd700;

margin-bottom:10px;

}



h3{

margin:10px;

}



.team{

width:300px;

background:rgba(255,255,255,.15);

border:2px solid transparent;

border-radius:15px;

padding:12px;

margin:5px;

text-align:center;

}



.team.selected{

border-color:#ffd700;

background:rgba(255,215,0,.25);

}



button{

margin-top:10px;

padding:12px 30px;

border:none;

border-radius:30px;

font-size:18px;

font-weight:bold;

}



#start{

background:#4caf50;
color:white;

}



#career{

background:#ffd700;

}



#hud{

position:absolute;

top:10px;
left:0;

width:100%;

display:flex;

justify-content:space-around;

color:white;

font-size:22px;

z-index:5;

}



.hidden{

display:none!important;

}



/* джойстик */


#joystick{

position:absolute;

left:20px;

bottom:25px;

width:110px;

height:110px;

border-radius:50%;

background:rgba(255,255,255,.25);

z-index:20;

}



#stick{

position:absolute;

left:30px;

top:30px;

width:50px;

height:50px;

background:white;

border-radius:50%;

}



#shoot{

position:absolute;

right:25px;

bottom:35px;

width:75px;

height:75px;

border-radius:50%;

background:#ffd700;

font-size:30px;

z-index:20;

}



</style>

</head>


<body>


<div id="game">


<canvas id="canvas"
width="360"
height="640">
</canvas>


<div id="menu">


<h1>⚽ MatchCup</h1>


<h3>Выбери команду</h3>


<div class="team" data-team="aziz">

🔥 Азиз + ⚔️ Хабиб

</div>


<div class="team" data-team="abdul">

🦁 Абдул + ⚡ Мухаммад

</div>


<h3>Соперник</h3>


<div class="team" data-enemy="shamil">

🛡 Шамиль + 🛡 Шамиль Jr

</div>


<div class="team" data-enemy="mjr">

⚡ Мухаммад + ⚡ Мухаммад Jr

</div>
<button id="start">
⚽ Играть 2 VS 2
</button>


<button id="career">
🏆 Карьера
</button>


</div>



<div id="hud" class="hidden">

<div>
🔴 <span id="scoreA">0</span>
</div>


<div>
⏱ <span id="time">60</span>
</div>


<div>
<span id="scoreB">0</span> 🔵
</div>

</div>




<div id="joystick">

<div id="stick"></div>

</div>



<button id="shoot">
⚽
</button>



</div>


<script src="game.js"></script>
<script src="career.js"></script>


</body>
</html>
