<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchCupMobile</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
touch-action:none;
user-select:none;
}


body{

background:#111;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Arial;

}


#game{

position:relative;

width:390px;

height:700px;

overflow:hidden;

}



canvas{

position:absolute;

top:0;
left:0;

width:390px;
height:500px;

background:#238b45;

border:3px solid white;

}







h1{

font-size:32px;

color:#ffd700;

margin-bottom:10px;

}


h3{

margin:6px;

}



.option{

width:280px;

background:#333;

padding:10px;

margin:3px;

border-radius:12px;

text-align:center;

}



.option.selected{

background:#ffd700;

color:black;

}



button{

padding:12px 30px;

margin:6px;

border:0;

border-radius:25px;

font-size:18px;

font-weight:bold;

}



#startBtn{

background:#22aa44;

color:white;

}



#careerBtn{

background:#ffd700;

}



#hud{

position:absolute;

top:10px;

width:100%;

display:flex;

justify-content:space-around;

color:white;

font-size:22px;

z-index:5;

}



.hidden{

display:none!important;

}



#joystick{

position:absolute;

bottom:20px;

left:20px;

width:120px;

height:120px;

border-radius:50%;

background:rgba(255,255,255,.25);

z-index:20;

}



#stick{

position:absolute;

width:50px;

height:50px;

left:35px;

top:35px;

border-radius:50%;

background:white;

}



.control{

position:absolute;

right:20px;

width:75px;

height:75px;

border-radius:50%;

font-size:25px;

z-index:20;

}



#pass{

bottom:130px;

background:#00bfff;

}



#shoot{

bottom:35px;

background:#ffd700;

}


</style>


</head>


<body>


<div id="game">


<canvas id="canvas" width="800" height="500"></canvas>



<div id="menu">


<h1>⚽ MatchCupMobile</h1>


<h3>Выбери команду</h3>


<div class="option selected" data-team="aziz">
🔥 Азиз + Хабиб
</div>


<div class="option" data-team="abdul">
🦁 Абдул + Мухаммад
</div>


<div class="option" data-team="shamil">
🛡 Шамиль + Шамиль Jr
</div>


<div class="option" data-team="muhammad">
⚡ Мухаммад + Мухаммад Jr
</div>



<h3>Режим</h3>


<div class="option selected" data-mode="2">
⚽ 2 VS 2
</div>


<div class="option" data-mode="3">
🥅 3 VS 3
</div>


<div class="option" data-mode="4">
🏟 4 VS 4
</div>



<h3>Сложность</h3>


<div class="option selected" data-level="easy">
🟢 Лёгкая
</div>


<div class="option" data-level="normal">
🟡 Средняя
</div>


<div class="option" data-level="hard">
🔴 Сложная
</div>



<button id="startBtn">
▶ Играть
</button>


<button id="careerBtn">
🏆 Карьера
</button>


</div>




<div id="hud" class="hidden">

<div>
🔴 <span id="scoreA">0</span>
</div>

<div>
⏱ <span id="time">60</span>
</div>

<div>
<span id="scoreB">0</span> 🔵
</div>


</div>



<div id="joystick">

<div id="stick"></div>

</div>


<button id="pass" class="control">
🟦
</button>


<button id="shoot" class="control">
⚽
</button>



</div>



<script src="game.js"></script>

<script src="career.js"></script>


</body>

</html>
